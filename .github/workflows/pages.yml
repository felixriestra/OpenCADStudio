name: Deploy web (GitHub Pages)
run-name: ${{ github.event.release.tag_name || github.ref_name }} Web

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Resolve release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          if [ -n "$RELEASE_COMMIT" ] && [ "$RELEASE_COMMIT" != "$COMMIT" ]; then
            echo "::error::Release tag and commit do not match"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          if [ -f scripts/release.py ]; then
            python3 scripts/release.py versions --tag "$RELEASE_TAG"
          else
            VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
            test "v$VERSION" = "$RELEASE_TAG"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Read wasm-bindgen version
        id: wasm-bindgen-version
        shell: bash
        run: |
          VERSION=$(sed -n '/name = "wasm-bindgen"/{n;s/version = "\(.*\)"/\1/p;q;}' Cargo.lock)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen-version.outputs.version }}

      - name: Build web bundle
        run: trunk build --locked --release --public-url /app/ --dist dist/app --html-output index.html web-app.html

      - name: Check out current website
        uses: actions/checkout@v4
        with:
          ref: main
          path: website

      - name: Validate website
        working-directory: website
        run: python3 scripts/test_site.py

      - name: Assemble landing page
        working-directory: website
        run: sh scripts/assemble-site.sh "$GITHUB_WORKSPACE/dist"

      - name: Record website source
        working-directory: website
        run: git rev-parse HEAD > "$GITHUB_WORKSPACE/dist/site-version.txt"

      - name: Record release version and source
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          jq -n --arg version "${RELEASE_TAG#v}" --arg commit "$RELEASE_COMMIT" \
            '{version: $version, commit: $commit}' > dist/app/release.json

      # GitHub Pages runs Jekyll, which ignores files; opt out so the
      # wasm-bindgen output is served verbatim.
      - run: touch dist/.nojekyll

      # Publish separate light/dark charts for stars and release downloads.
      - name: Generate project growth charts
        env:
          GITHUB_TOKEN: ${{ secrets.OCS_GITHUB_TOKEN }}
        run: python3 website/scripts/generate-star-history.py --output-dir dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          expected = {"version": os.environ["RELEASE_TAG"].removeprefix("v"), "commit": os.environ["RELEASE_COMMIT"]}
          url = os.environ["PAGE_URL"].rstrip("/") + "/app/release.json?commit=" + expected["commit"]
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      if json.load(response) == expected:
                          print("Verified web release", expected["version"], expected["commit"])
                          break
              except (OSError, ValueError) as error:
                  print(error)
              time.sleep(10)
          else:
              raise SystemExit("Deployed web version does not match the release")
          PY
